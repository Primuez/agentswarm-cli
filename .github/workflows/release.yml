name: Release

# Push a tag like v0.1.0 to publish both packages. Each registry is skipped
# unless its credentials are configured:
#   npm:  repository secret NPM_TOKEN (published with --provenance)
#   PyPI: repository secret PYPI_TOKEN, or trusted publishing for this workflow
#         with the repository variable PYPI_TRUSTED_PUBLISHING set to "true"
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches both package versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node_version=$(node -p "require('./node/package.json').version")
          py_version=$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag node=$node_version python=$py_version"
          test "$tag" = "$node_version" && test "$tag" = "$py_version"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Node tests
        working-directory: node
        run: npm test
      - name: Python tests
        working-directory: python
        run: python -m unittest discover -s tests

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without NPM_TOKEN
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not set; skipping the npm release."
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish agentswarm-space to npm
        if: env.NPM_TOKEN != ''
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  pypi:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
    steps:
      - name: Skip without PyPI credentials
        if: env.PYPI_TOKEN == '' && env.TRUSTED != 'true'
        run: echo "Neither PYPI_TOKEN nor PYPI_TRUSTED_PUBLISHING is set; skipping the PyPI release."
      - uses: actions/checkout@v4
        if: env.PYPI_TOKEN != '' || env.TRUSTED == 'true'
      - uses: actions/setup-python@v5
        if: env.PYPI_TOKEN != '' || env.TRUSTED == 'true'
        with:
          python-version: "3.12"
      - name: Build
        if: env.PYPI_TOKEN != '' || env.TRUSTED == 'true'
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish agentswarm-space to PyPI with a token
        if: env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          password: ${{ secrets.PYPI_TOKEN }}
      - name: Publish agentswarm-space to PyPI with trusted publishing
        if: env.PYPI_TOKEN == '' && env.TRUSTED == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
